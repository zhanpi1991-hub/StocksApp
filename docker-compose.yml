services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: stocks, POSTGRES_PASSWORD: stocks, POSTGRES_DB: stocks }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U stocks"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://stocks:stocks@db:5432/stocks
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
