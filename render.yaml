# Render Blueprint for the StocksApp API + PostgreSQL. Nothing is deployed until you apply it in the Render dashboard.
# Secrets are never stored here: `sync: false` makes Render prompt for the value when the Blueprint is created.
#
# NOTE (free plan facts, verified in Render docs): the free web service sleeps after 15 min without traffic (cold start
# ~1 min, alerts and WebSocket polling pause while asleep) and the free PostgreSQL database EXPIRES 30 DAYS after creation
# (14-day grace, then deleted) with NO backups. Use a paid plan, or an external managed Postgres via DATABASE_URL, for real data.
services:
  - type: web
    name: stocksapp-api
    runtime: docker
    plan: free                      # explicit: Render's default plan for new services is a paid one
    region: oregon                  # must match the database region; cannot be changed later
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health    # returns 503 when the database is unreachable
    autoDeployTrigger: off          # deploy manually until you are comfortable; use `commit` for auto-deploys
    envVars:
      - { key: APP_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: stocksapp-db, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, sync: false }          # e.g. https://your-app.vercel.app  (no trailing slash)
      - { key: FINNHUB_API_KEY, sync: false }
      - { key: TWELVE_DATA_API_KEY, sync: false }
      - { key: FMP_API_KEY, sync: false }
      - { key: COINGECKO_API_KEY, sync: false }
databases:
  - name: stocksapp-db
    plan: free
    region: oregon
    databaseName: stocksapp
    user: stocksapp
    postgresMajorVersion: "17"
